<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Entre em contato com a Companhia de Rafting em Corredeiras. Envie suas dúvidas, sugestões ou mensagens sobre reservas.">
    <meta name="author" content="Douglas Silva">
    <title>Fale Conosco | Rafting em Corredeiras</title>
    <link rel="stylesheet" href="estilos/rafting.css">
</head>

<body>
    <header>
        <img src="imagens/logo.png" alt="Logotipo oficial da Companhia de Rafting" class="logo">
        <nav>
            <ul class="navegacao">
                <li><a href="index.html">Página Inicial</a></li>
                <li><a href="sobre.html">Sobre Nós</a></li>
                <li><a href="trips.html">Viagens</a></li>
                <li><a href="contato.html">Fale Conosco</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <section class="titulo-pagina">
            <h1>Companhia de Rafting em Corredeiras</h1>
            <p>123 Rua Principal do Rio</p>
            <p>Foz do Iguaçu, Paraná</p>
            <p>+55 45 99999-9999</p>
            <p>info@correiras.com</p>
        </section>

        <div class="container-contato">

            <div class="mapa-container">
                <!-- Google Maps Iframe Atualizado -->
                <iframe
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d47575.005370111125!2d-48.58816467816912!3d-27.592493157109093!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x9527394eb2c632d7%3A0x81bc550b6a04c746!2sFlorian%C3%B3polis%2C%20SC!5e0!3m2!1spt-BR!2sbr!4v1781054740494!5m2!1spt-BR!2sbr"
                    width="600" height="450" allowfullscreen="" loading="lazy"
                    referrerpolicy="no-referrer-when-downgrade" title="Mapa de localização em Florianópolis">
                </iframe>
            </div>

            <form action="#" method="post">
                <fieldset>

                    <div class="item-formulario coluna2">
                        <label for="nomecompleto">Nome</label>
                        <input type="text" id="nomecompleto" name="nomecompleto" placeholder="Digite aqui" required>
                    </div>

                    <div class="item-formulario coluna2">
                        <label for="emaildousuario">E-mail</label>
                        <input type="email" id="emaildousuario" name="emaildousuario" placeholder="Digite aqui"
                            required>
                    </div>

                    <div class="item-formulario coluna1">
                        <label>Propósito da Mensagem</label>
                        <div class="opcoes-radio">
                            <div class="radio-flex">
                                <input type="radio" id="geral" name="proposito" value="geral" checked>
                                <label for="geral">Dúvida Geral</label>
                            </div>
                            <div class="radio-flex">
                                <input type="radio" id="reserva" name="proposito" value="reserva">
                                <label for="reserva">Pergunta sobre Reserva</label>
                            </div>
                            <div class="radio-flex">
                                <input type="radio" id="sugestao" name="proposito" value="sugestao">
                                <label for="sugestao">Sugestão de Site</label>
                            </div>
                        </div>
                    </div>

                    <div class="item-formulario bloco-texto">
                        <label for="feedback">Mensagem</label>
                        <textarea id="feedback" name="feedback" rows="4" placeholder="Digite aqui" required></textarea>
                    </div>

                    <div class="item-formulario checkbox-container">
                        <input type="checkbox" id="newsletter" name="newsletter">
                        <label for="newsletter">Por favor, me inscreva na newsletter mensal</label>
                    </div>

                    <button type="submit">Entrar em Contato</button>

                </fieldset>
            </form>
        </div>

        <section class="funcionarios-section">
            <h2>Estamos Aqui para Servi-lo</h2>
            <div class="funcionarios-grid">
                <figure>
                    <img src="imagens/imagem_perfil1.png" alt="Retrato circular de Carlos Silva, Guia Chefe">
                    <figcaption><strong>Carlos Silva</strong><br>Guia Chefe</figcaption>
                </figure>
                <figure>
                    <img src="imagens/imagem_perfil2.png"
                        alt="Retrato circular de Ana Costa, Coordenadora de Segurança">
                    <figcaption><strong>Ana Costa</strong><br>Coordenadora de Segurança</figcaption>
                </figure>
                <figure>
                    <img src="imagens/imagem_perfil3.png"
                        alt="Retrato circular de Mateus Rocha, Atendimento ao Cliente">
                    <figcaption><strong>Mateus Rocha</strong><br>Atendimento ao Cliente</figcaption>
                </figure>
            </div>
        </section>

    </main>

    <footer>
        <p>© 2026 Corrente Viva Rafting | Douglas Silva</p>
        <nav class="redes-sociais">
            <a href="https://facebook.com" target="_blank" rel="noopener noreferrer">
                <img src="imagens/facebook.svg" alt="Facebook da empresa">
            </a>
            <a href="https://instagram.com" target="_blank" rel="noopener noreferrer">
                <img src="imagens/instagram.svg" alt="Instagram da empresa">
            </a>
            <a href="https://linkedin.com" target="_blank" rel="noopener noreferrer">
                <img src="imagens/linkedin.svg" alt="LinkedIn da empresa">
            </a>
        </nav>
    </footer>
</body>

</html>
